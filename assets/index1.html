<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Racer</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
        <!-- Top Label -->
        <div class="badge">
            ⚡ READY TO RACE
        </div>


        <!-- Main Title -->
        <h1>
            🏎️ Type Racer
        </h1>


        <!-- Tagline -->
        <p class="tagline">
            Race. Type. Survive.
        </p>


        <!-- Description -->
        <p class="description">

            A typing race where speed keeps you ahead,
            accuracy keeps you alive, and every mistake
            can change the race.

        </p>


        <!-- =========================
             CAR SELECTION
             ========================= -->

        <div class="car-title">
            Choose Your Car
        </div>


        <div class="car-selection">


            <!-- RED CAR -->

            <div
                class="car-card selected"
                data-car="Red">

                <img
                    src="assets/red-car.png"
                    alt="Red Car"
                    class="car-image"
                >

                <div class="car-name">
                    Red Racer
                </div>

                <button
                    class="select-btn">

                    Selected

                </button>

            </div>


            <!-- BLUE CAR -->

            <div
                class="car-card"
                data-car="Blue">

                <img
                    src="assets/blue-car.png"
                    alt="Blue Car"
                    class="car-image"
                >

                <div class="car-name">
                    Blue Racer
                </div>

                <button
                    class="select-btn">

                    Select

                </button>

            </div>


            <!-- BLACK CAR -->

            <div
                class="car-card"
                data-car="Black">

                <img
                    src="assets/black-car.png"
                    alt="Black Car"
                    class="car-image"
                >

                <div class="car-name">
                    Black Racer
                </div>

                <button
                    class="select-btn">

                    Select

                </button>

            </div>

        </div>


        <!-- =========================
             CREATE + JOIN ROOM
             ========================= -->

        <div class="buttons">

            <button
                id="createRoom"
                class="create-btn">

                Create Room

            </button>


            <button
                id="joinRoom"
                class="join-btn">

                Join Room

            </button>

        </div>


        <!-- =========================
             PRACTICE SESSION
             ========================= -->

        <div class="practice-container">

            <button
                id="practiceSession"
                class="practice-btn">

                🎯 Practice Session

            </button>

        </div>


        <!-- =========================
             FEATURES
             ========================= -->

        <div class="features">

            <div class="feature">
                ⚡ 2 Players
            </div>

            <div class="feature">
                🏁 Race Mode
            </div>

            <div class="feature">
                ❤️ HP System
            </div>

            <div class="feature">
                🪨 Dynamic Obstacles
            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
