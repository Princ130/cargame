<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Type Racer</title>

    <link rel="stylesheet" href="style1.css">

</head>

<body>

    <div class="container">

        <!-- Top Label -->
        <div class="badge">
            ⚡ READY TO RACE
        </div>


        <!-- Main Title -->
        <h1>
            🏎️ Type Racer
        </h1>


        <!-- Tagline -->
        <p class="tagline">
            Race. Type. Survive.
        </p>


        <!-- Description -->
        <p class="description">

            A typing race accuracy keeps you alive, and every mistake
            can change the race.

        </p>


             <!-- CAR SELECTION -->

<div class="car-title">
    Choose Your Car
</div>

<div class="car-selector">

    <button
        id="prevCar"
        class="car-arrow"
        type="button"
        aria-label="Previous car"
    >
        ←
    </button>


    <div class="car-display">

        <img
            id="selectedCarImage"
            src="assets/red-car.png"
            alt="Red Racer"
        >

        <div
            id="selectedCarName"
            class="car-name"
        >
            Red Racer
        </div>

    </div>


    <button
        id="nextCar"
        class="car-arrow"
        type="button"
        aria-label="Next car"
    >
        →
    </button>

</div>


        <!-- =========================
             CREATE + JOIN ROOM
             ========================= -->

        <div class="buttons">

            <button
                id="createRoom"
                class="create-btn">

                Create Room

            </button>


            <button
                id="joinRoom"
                class="join-btn">

                Join Room

            </button>
            <!-- =========================
     JOIN ROOM
========================== -->

<div
    id="joinRoomScreen"
    class="room-screen hidden">

    <div class="room-box">

        <h2>🚪 Join Room</h2>

        <p>
            Enter the room code given by your opponent.
        </p>

        <input
            type="text"
            id="roomCodeInput"
            placeholder="Enter Room Code"
            maxlength="6"
            autocomplete="off"
        >

        <button
            id="confirmJoin"
            class="confirm-btn">

            Join Room

        </button>

        <button
            id="backFromJoin"
            class="back-btn">

            ← Back

        </button>

        <p
            id="joinError"
            class="join-error">
        </p>

    </div>
    </div>


        </div>


        <!-- =========================
             PRACTICE SESSION
             ========================= -->

        <div class="practice-container">

            <a href="trial.html"><button
                id="practiceSession"
                class="practice-btn">
                
                🎯 Practice Session

            </button></a>

        </div>


        <!-- =========================
             FEATURES
             ========================= -->

        <div class="features">

            <div class="feature">
                ⚡ 2 Players
            </div>

            <div class="feature">
                🏁 Race Mode
            </div>

            <div class="feature">
                ❤️ HP System
            </div>

            <div class="feature">
                🪨 Dynamic Obstacles
            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="dashboard.js"></script>
    <script src="join.js"></script>
    <script src="create.js"></script>
</body>

</html>
